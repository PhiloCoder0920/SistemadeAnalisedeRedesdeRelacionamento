<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulação de Falhas - Resiliência da Rede</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  
  <div class="sidebar">
    <div>
      <div class="brand">
        <h2>Rede Social</h2>
        <p>Teoria dos Grafos</p>
      </div>
      <ul class="nav-menu">
        <li class="nav-item "><a href="../index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg> Início</a></li>
        <li class="nav-item "><a href="consultas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg> Consultas</a></li>
        <li class="nav-item active"><a href="falhas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 2.5 17.4A1.8 1.8 0 0 0 4 20h16a1.8 1.8 0 0 0 1.5-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/></svg> Falhas</a></li>
        <li class="nav-item "><a href="perfil.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg> Perfil</a></li>
        <li class="nav-item "><a href="dados.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg> Dados</a></li>
      </ul>
    </div>
  </div>
  
  <div class="main-content">
    <div class="header">
      <h1>Simulação de Falhas</h1>
      <p>Teste a resiliência da rede diante de interrupções de vínculos</p>
    </div>
    <div class="content-body">
      <div class="grid-2">
        <div class="card">
          <h3>Grafo da Rede</h3>
          <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">Arestas desativadas aparecem tracejadas em vermelho</p>
          <div class="canvas-container">
            <canvas id="falhasCanvas"></canvas>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="card">
            <h3>Simular Bloqueio</h3>
            <div class="form-group" style="margin-top:15px;">
              <label>Conexão a desativar</label>
              <select id="selectConexao"></select>
            </div>
            <button id="btnBloquear" class="btn-danger" style="width:100%;">Simular Bloqueio</button>
          </div>

          <div class="card">
            <h3>Recalcular Rota Alternativa</h3>
            <div class="form-group" style="margin-top:10px;">
              <label>Origem</label>
              <select id="selectOrigemFalha"></select>
            </div>
            <div class="form-group">
              <label>Destino</label>
              <select id="selectDestinoFalha"></select>
            </div>
            <button id="btnRecalcular" style="width:100%;">Recalcular Rota</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/grafo.js"></script>
  <script src="../js/algoritmos.js"></script>
  <script>
    const selectConexao = document.getElementById('selectConexao');
    const selectOrigem = document.getElementById('selectOrigemFalha');
    const selectDestino = document.getElementById('selectDestinoFalha');

    function preencherOpcoes() {
      selectConexao.innerHTML = '';
      dadosGrafo.arestas.forEach(e => {
        selectConexao.add(new Option(`${e.origem} &rarr; ${e.destino} (Peso: ${e.peso})`, `${e.origem},${e.destino}`));
      });

      selectOrigem.innerHTML = '';
      selectDestino.innerHTML = '';
      dadosGrafo.nos.forEach(n => {
        selectOrigem.add(new Option(n.id, n.id));
        selectDestino.add(new Option(n.id, n.id));
      });
    }

    window.addEventListener('load', () => {
      preencherOpcoes();
      desenharGrafo('falhasCanvas');
    });

    document.getElementById('btnBloquear').addEventListener('click', () => {
      const [origem, destino] = selectConexao.value.split(',');
      dadosGrafo.arestasDesativadas.push({ origem, destino });
      desenharGrafo('falhasCanvas');
      alert(`Conexão entre ${origem} e ${destino} desativada!`);
    });

    document.getElementById('btnRecalcular').addEventListener('click', () => {
      const caminho = executarDijkstra(selectOrigem.value, selectDestino.value);
      if (caminho) {
        desenharGrafo('falhasCanvas', caminho);
      } else {
        alert('Sem rota alternativa disponível!');
      }
    });
  </script>
</body>
</html>
