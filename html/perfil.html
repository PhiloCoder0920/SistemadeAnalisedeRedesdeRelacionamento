<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Usuário - Inspeção Detalhada</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  
  <div class="sidebar">
    <div>
      <div class="brand">
        <h2>Rede Social</h2>
        <p>Teoria dos Grafos</p>
      </div>
      <ul class="nav-menu">
        <li class="nav-item "><a href="../index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg> Início</a></li>
        <li class="nav-item "><a href="consultas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg> Consultas</a></li>
        <li class="nav-item "><a href="falhas.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 2.5 17.4A1.8 1.8 0 0 0 4 20h16a1.8 1.8 0 0 0 1.5-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/></svg> Falhas</a></li>
        <li class="nav-item active"><a href="perfil.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg> Perfil</a></li>
        <li class="nav-item "><a href="dados.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg> Dados</a></li>
      </ul>
    </div>
  </div>
  
  <div class="main-content">
    <div class="header">
      <h1>Perfil do Usuário</h1>
      <p>Inspeção detalhada de um perfil e sua vizinhança direta</p>
    </div>
    <div class="content-body">
      <div class="card">
        <div class="form-group" style="max-width:300px;">
          <label>Selecionar Usuário</label>
          <select id="selectUsuarioPerfil"></select>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Métricas do Perfil</h3>
          <div style="margin-top:15px; display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; justify-content:space-between; background:#141418; padding:12px; border-radius:6px;">
              <span class="metric-label"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg> Segue</span>
              <strong id="metricSegue">3</strong>
            </div>
            <div style="display:flex; justify-content:space-between; background:#141418; padding:12px; border-radius:6px;">
              <span class="metric-label"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg> Seguidores</span>
              <strong id="metricSeguidores">2</strong>
            </div>
            <div style="display:flex; justify-content:space-between; background:#141418; padding:12px; border-radius:6px;">
              <span>Grau Total</span>
              <strong id="metricGrau">5</strong>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>Subgrafo de Vizinhança Direta</h3>
          <div class="canvas-container" style="margin-top:15px;">
            <canvas id="perfilCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/grafo.js"></script>
  <script>
    const selectUser = document.getElementById('selectUsuarioPerfil');
    dadosGrafo.nos.forEach(n => selectUser.add(new Option(n.id, n.id)));
    selectUser.value = 'Bruno';

    function atualizarPerfil() {
      const usuario = selectUser.value;
      const segue = dadosGrafo.arestas.filter(e => e.origem === usuario).length;
      const seguidores = dadosGrafo.arestas.filter(e => e.destino === usuario).length;

      document.getElementById('metricSegue').innerText = segue;
      document.getElementById('metricSeguidores').innerText = seguidores;
      document.getElementById('metricGrau').innerText = segue + seguidores;

      desenharGrafo('perfilCanvas', [], usuario);
    }

    selectUser.addEventListener('change', atualizarPerfil);
    window.addEventListener('load', atualizarPerfil);
  </script>
</body>
</html>
